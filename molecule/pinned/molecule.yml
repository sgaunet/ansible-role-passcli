---
role_name_check: 1
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: passcli-pinned
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
  inventory:
    group_vars:
      all:
        # Deliberately an older release, so the scenario proves the pinned code
        # path is honoured instead of installing whatever "latest" resolves to.
        passcli_pinned_version: "2.3.1"
verifier:
  name: ansible
