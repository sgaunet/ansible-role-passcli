---
role_name_check: 1
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: passcli-upgrade
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
  inventory:
    group_vars:
      all:
        # Version seeded by prepare.yml; converge.yml then asks for "latest",
        # which must replace it.
        passcli_old_version: "2.3.1"
verifier:
  name: ansible
